<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E-commerce App</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav class="navbar navbar-expand-lg bg-light px-3">
<a class="navbar-brand" href="#">E-commerce App</a>
<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
<span class="navbar-toggler-icon"></span>
</button>
<div class="collapse navbar-collapse" id="menu">
<ul class="navbar-nav ms-auto">
<li class="nav-item"><a class="nav-link" href="#">Home</a></li>
<li class="nav-item"><a class="nav-link" href="#products">Products</a></li>
<li class="nav-item"><a class="nav-link" href="#about">About</a></li>
</ul>
</div>
</nav>

<div id="bannerSlider" class="carousel slide" data-bs-ride="carousel">
<div class="carousel-indicators">
<button type="button" data-bs-target="#bannerSlider" data-bs-slide-to="0" class="active" aria-label="Slide 1"></button>
<button type="button" data-bs-target="#bannerSlider" data-bs-slide-to="1" aria-label="Slide 2"></button>
<button type="button" data-bs-target="#bannerSlider" data-bs-slide-to="2" aria-label="Slide 3"></button>
</div>
<div class="carousel-inner">
<div class="carousel-item active">
<img src="banner.jpg" class="d-block w-100 banner-img" alt="Kids fashion banner">
</div>
<div class="carousel-item">
<img src="https://images.unsplash.com/photo-1529139574466-a303027c1d8b?auto=format&fit=crop&w=1400&q=85" class="d-block w-100 banner-img" alt="Fashion">
</div>
<div class="carousel-item">
<img src="thomas.jpg" class="d-block w-100 banner-img" alt="Thomas Shelby style portrait">
</div>
</div>
<button class="carousel-control-prev" type="button" data-bs-target="#bannerSlider" data-bs-slide="prev">
<span class="carousel-control-prev-icon" aria-hidden="true"></span><span class="visually-hidden">Previous</span>
</button>
<button class="carousel-control-next" type="button" data-bs-target="#bannerSlider" data-bs-slide="next">
<span class="carousel-control-next-icon" aria-hidden="true"></span><span class="visually-hidden">Next</span>
</button>
</div>

<div class="container-fluid py-4" id="products">
<h2 class="text-center mb-4">Kids Products</h2>
<div class="row g-3" id="productList"></div>
</div>

<footer class="bg-light text-center py-4" id="about">
<div class="mb-3">
<a href="#" class="footer-link">Home</a>
<a href="#" class="footer-link">Features</a>
<a href="#" class="footer-link">Pricing</a>
<a href="#" class="footer-link">FAQs</a>
<a href="#about" class="footer-link">About</a>
</div>
<hr>
<p class="mb-0">© 2026 Company, Inc</p>
</footer>

<a href="https://wa.me/" class="whatsapp" aria-label="WhatsApp">
<i class="bi bi-whatsapp"></i>
</a>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
const items = [
["Kids Cartoon T-Shirt","Soft cotton t-shirt.",1499],
["Kids Graphic T-Shirt","Trendy graphic t-shirt.",1599],
["Kids Denim Shorts","Comfortable denim shorts.",1899],
["Kids Cotton Shorts","Lightweight cotton shorts.",1699],
["Kids Pajama Set","Soft pajama set.",2299],
["Kids Night Suit","Comfortable night wear.",2499],
["Kids Jeans","Stretchable denim jeans.",2799],
["Kids Track Pants","Comfortable track pants.",1999],
["Kids Hoodie","Warm winter hoodie.",3499],
["Kids Sweatshirt","Soft fleece sweatshirt.",2999],
["Kids Jacket","Warm winter jacket.",4499],
["Kids Denim Jacket","Stylish denim jacket.",4999],
["Kids Rain Coat","Waterproof rain coat.",2499],
["Kids School Uniform","School uniform set.",2999],
["Kids School Shoes","Durable school shoes.",3499],
["Kids Building Blocks","Educational building blocks.",2499],
["Kids Puzzle Game","Puzzle game for kids.",1999],
["Kids Doll","Cute doll for kids.",1799],
["Kids Teddy Bear","Soft teddy bear.",2299],
["Kids Toy Kitchen Set","Toy kitchen set.",4499],
["Kids Cricket Bat","Cricket bat for kids.",1599],
["Kids Football","Football for outdoor play.",1299],
["Kids Bicycle Helmet","Safety helmet for kids.",2499],
["Kids Cap","Adjustable kids cap.",799],
["Kids Sunglasses","Sunglasses for kids.",1199],
["Kids Wrist Watch","Digital wrist watch.",2499],
["Kids Smart Watch","Smart watch for kids.",8999],
["Kids Rain Boots","Water resistant boots.",3499],
["Kids Winter Gloves","Warm winter gloves.",1299],
["Kids Muffler","Soft woolen muffler.",1499],
["Kids Blanket","Cozy kids blanket.",2999],
["Kids Pillow","Comfortable pillow.",1999],
["Kids Study Table","Study table for kids.",8999],
["Kids Chair","Kids chair.",4999],
["Kids Storage Box","Toy storage box.",2499]
];

const productList = document.getElementById("productList");
items.forEach(item => {
    const col = document.createElement("div");
    col.className = "col-4 col-md-3 col-lg-2";
    col.innerHTML = `
        <div class="card h-100">
            <div class="card-body p-2">
                <h6 class="card-title">${item[0]}</h6>
                <p class="card-text">${item[1]}</p>
                <p class="price">Rs. ${item[2]}</p>
                <button class="btn btn-primary btn-sm w-100">Add To Cart</button>
            </div>
        </div>`;
    col.querySelector("button").addEventListener("click", () => {
        alert(item[0] + " added to cart!");
    });
    productList.appendChild(col);
});
</script>
</body>
</html>
